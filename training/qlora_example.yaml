# Example only. Replace all paths and register your own dataset with LLaMA-Factory.
model_name_or_path: /path/to/deepseek-coder-33b-instruct
trust_remote_code: true
stage: sft
do_train: true
finetuning_type: lora
quantization_bit: 4
quantization_method: bnb
double_quantization: true
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
template: deepseekcoder
dataset_dir: /path/to/dataset
dataset: multi_protocol_field_mapping
eval_dataset: multi_protocol_field_mapping_eval
cutoff_len: 4096
max_samples: 6000
output_dir: /path/to/new-output-directory
overwrite_output_dir: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
optim: paged_adamw_8bit
seed: 42
